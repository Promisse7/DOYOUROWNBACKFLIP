<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Karan!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            /* Foto de fondo principal */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Lluvia de Flores de Cerezo */
        .petal {
            position: fixed;
            top: -10%;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        @keyframes sway {
            0% { transform: rotate(0deg) translateX(0px); }
            100% { transform: rotate(180deg) translateX(50px); }
        }

        /* Pantalla de Inicio / Bienvenida */
        #welcome-screen {
            text-align: center;
            color: white;
            z-index: 5;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 20px;
        }

        #welcome-screen h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #ffb7c5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn-open {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 15px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.3s ease;
        }

        .btn-open:hover {
            background-color: #ff4757;
            transform: scale(1.05);
        }

        /* Contenido Principal (Oculto al inicio) */
        #main-content {
            display: none;
            z-index: 5;
            max-width: 800px;
            width: 90%;
            margin: 40px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .card h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .dedication {
            color: #2f3542;
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .signature {
            font-weight: bold;
            color: #e84393;
            font-size: 1.3rem;
            margin-top: 20px;
        }

        /* Seccion Cartas */
        .letters-section {
            margin-top: 40px;
            border-top: 2px dashed #ffb7c5;
            padding-top: 30px;
        }

        .letters-section h2 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 4px solid white;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.04);
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con la foto de fondo -->
    <div id="welcome-screen">
        <h1>🌸 Happy Birthday Karan! 🌸</h1>
        <p style="font-size: 1.2rem; margin-bottom: 25px;">You have a special message waiting for you.</p>
        <button class="btn-open" onclick="openCard()">Open Message 💌</button>
    </div>

    <!-- Carta y dedicatoria en inglés -->
    <div id="main-content">
        <div class="card">
            <h1>🎉 Happy Birthday, Karan! 🎉</h1>
            
            <div class="dedication">
                <p>We wish you a wonderful and happy birthday full of joy, love, and laughter!</p>
                <div class="signature">
                    With all our love,<br>
                    Your friends Nina, Pauli, Angi,<br>
                    and your love Bárbara ❤️
                </div>
            </div>

            <!-- Sección de cartas hechas a mano -->
            <div class="letters-section">
                <h2>💌 Look at our letters 💌</h2>
                <div class="gallery">
                    <img src="carta1.jpg" alt="Handwritten letter 1">
                    <img src="carta2.jpg" alt="Handwritten letter 2">
                    <img src="carta3.jpg" alt="Handwritten letter 3">
                    <img src="carta4.jpg" alt="Handwritten letter 4">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función para abrir la carta
        function openCard() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Script para crear pétalos de flor de cerezo
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 10 + 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            
            const fallDuration = Math.random() * 5 + 5;
            const swayDuration = Math.random() * 3 + 2;
            petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
            
            document.body.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, fallDuration * 1000);
        }

        setInterval(createPetal, 300);
    </script>
</body>
</html>
